# tmux keeps Linux Terminal sessions alive when the Terminal app's connection to the VM drops
# (its terminal server kills the shell on disconnect). New Terminal windows re-attach
# automatically (see the end of ~/.profile).
set -s escape-time 0            # no delay after Esc (matters for editors and other full-screen programs)
set -g mouse on                 # mouse wheel scrolls back; hold Shift to select text for copying
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -g set-clipboard on
set -g status-style "bg=colour236,fg=colour250"
set -g status-left " #[fg=colour114]protected session#[default] "
set -g status-left-length 30
set -g status-right " %H:%M "
